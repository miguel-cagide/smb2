name: Publish Package to npmjs
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
        # npm tries trusted publishing (OIDC) first and falls back to this token; remove once trusted publishing is set up
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PAT }}
